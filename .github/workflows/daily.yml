name: Daily GitHub trending snapshot

on:
  schedule:
    # GitHub often delays scheduled jobs by hours (and sometimes drops them),
    # so try every 3 hours. The first run of the UTC day saves the snapshot;
    # later runs see today's file already exists and skip. Minute 17 avoids
    # the overloaded top-of-hour slot.
    - cron: "17 */3 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab (always scrapes)

permissions:
  contents: write # needed to commit trending.json back to the repo

concurrency:
  group: trending-snapshot
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's snapshot already exists
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "history/$(date -u +%F).json" ]; then
            echo "Snapshot for $(date -u +%F) already saved; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
        if: steps.check.outputs.skip != 'true'

      - run: npm run scrape
        if: steps.check.outputs.skip != 'true'

      - name: Commit results
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending.json history/
          git diff --cached --quiet && exit 0
          git commit -m "Trending snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push
