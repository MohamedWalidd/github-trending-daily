name: Daily GitHub trending snapshot

on:
  schedule:
    # 04:30 UTC = 7:30 AM Cairo. Runs early because GitHub can delay scheduled jobs.
    - cron: "30 4 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write # needed to commit trending.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - run: npm run scrape

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending.json history/
          git diff --cached --quiet || git commit -m "Trending snapshot $(date -u +%F)"
          git push
